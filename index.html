<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <!-- 設定文字編碼，避免中文顯示亂碼 -->
  <meta charset="UTF-8">

  <!-- 讓網頁能適應手機與不同螢幕尺寸 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 設定瀏覽器分頁標題 -->
  <title>陳駿霆的個人網站</title>

  <!-- ★ 作業要求 2：連結外部的 CSS 檔案 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- header：網頁的頁首區域 -->
  <header>
    <!-- h1：網頁最主要的標題 -->
    <h1>陳駿霆的個人網站</h1>

    <!-- nav：放置網頁導覽連結 -->
    <nav>
      <!-- 連結到目前的首頁 -->
      <a href="index.html">首頁</a>

      <!-- 連結到同一個資料夾中的 about.html -->
      <a href="about.html">關於我</a>

      <!-- 連結到外部網站 -->
      <!-- target="_blank" 代表在新分頁開啟 -->
      <a
        href="https://www.tku.edu.tw/"
        target="_blank"
        rel="noreferrer"
      >
        淡江大學
      </a>
    </nav>
  </header>

  <!-- main：網頁的主要內容 -->
  <main>

    <!-- section：自我介紹區域 -->
    <section>
      <h2>自我介紹</h2>

      <!-- 插入圖片 -->
      <!-- src：圖片檔案的位置 -->
      <!-- alt：圖片無法顯示時的替代文字 -->
      <!-- width：設定圖片寬度 -->
      <img
        src="images/profile.jpg"
        alt="陳駿霆的個人照片"
        width="200"
      >

      <!-- p：建立段落 -->
      <p>
        大家好，我是淡江大學資管系大三的學生陳駿霆，
        這是我第一堂網頁程式設計課的作業。
      </p>

      <!-- strong：表示重要或需要強調的文字 -->
      <!-- em：表示語氣上的強調文字 -->
      <p>
        平時除了上課，我最喜歡
        <strong>打籃球</strong>
        與去
        <em>健身工廠</em>
        鍛鍊。
      </p>
    </section>

    <!-- section：興趣清單區域 -->
    <section>
      <h2>我的興趣</h2>

      <!-- ul：建立無序清單 -->
      <ul>
        <!-- li：清單中的一個項目 -->
        <li>打籃球</li>
        <li>健身</li>
        <li>跑步</li>
      </ul>
    </section>

    <!-- section：健身步驟區域 -->
    <section>
      <h2>我的健身步驟</h2>

      <!-- ol：建立有順序的清單 -->
      <ol>
        <li>動態暖身（活動關節與預防受傷）</li>
        <li>重量訓練（專注肌肉感受度）</li>
        <li>有氧與收操（伸展放鬆肌肉）</li>
      </ol>
    </section>

    <!-- section：健身菜單表格區域 -->
    <section>
      <h2>一週訓練菜單</h2>

      <!-- table：建立表格 -->
      <table>
        <!-- caption：設定表格標題 -->
        <caption>健身工廠訓練排程</caption>

        <!-- thead：表格的標題區域 -->
        <thead>
          <tr>
            <!-- th：表格標題欄位 -->
            <th scope="col">天數</th>
            <th scope="col">訓練部位</th>
          </tr>
        </thead>

        <!-- tbody：表格的資料內容區域 -->
        <tbody>
          <!-- tr：建立一列表格資料 -->
          <tr>
            <!-- td：一般資料欄位 -->
            <td>Day 1</td>
            <td>胸部與三頭肌（推）</td>
          </tr>

          <tr>
            <td>Day 2</td>
            <td>背部與二頭肌（拉）</td>
          </tr>

          <tr>
            <td>Day 3</td>
            <td>腿部與核心（腿）</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- div：一般區塊容器，本身沒有特殊語意 -->
    <div>
      <h2>更多資訊</h2>

      <!-- 插入連結到 about.html -->
      <p>
        <a href="about.html">查看完整自我介紹</a>
      </p>
    </div>
  </main>

  <!-- footer：網頁的頁尾區域 -->
  <footer>
    <p>© 2026 陳駿霆</p>
  </footer>
</body>

</html>
